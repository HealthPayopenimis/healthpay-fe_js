name: HealthPay claim-context candidate

on:
  push:
    branches: ['poc/claim-context-release-oct28']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate pinned module configuration
        run: |
          npm install -g npm@10.9.9
          npm run check-package
          npm run load-config
          node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync("package.json"));const b=fs.readFileSync("script/poc/baseline-package-lock.json","utf8");const old=JSON.parse(b).packages[""].dependencies["@openimis/fe-claim"].split("#").pop();const current=p.dependencies["@openimis/fe-claim"].split("#").pop();if(!/^[a-f0-9]{40}$/.test(current))throw Error("EXACT_CLAIM_PIN_REQUIRED");fs.writeFileSync("package-lock.json",b.split(old).join(current));'
      - name: Install and build complete assembly
        run: |
          npm ci --include=dev --legacy-peer-deps
          python3 script/poc/verify_dependency_delta.py script/poc/baseline-package-lock.json package-lock.json
          mkdir -p candidate-provenance
          node --version > candidate-provenance/tool-versions.txt
          npm --version >> candidate-provenance/tool-versions.txt
          cp package-lock.json candidate-provenance/package-lock.json
          cp openimis.json candidate-provenance/openimis.json
          sha256sum candidate-provenance/package-lock.json > candidate-provenance/dependency-lock.sha256
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: healthpay-poc-frontend-${{ github.sha }}
          path: |
            build/
            candidate-provenance/
          if-no-files-found: error
